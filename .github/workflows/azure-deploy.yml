name: Deploy to Azure Web App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: npm install

      - name: Build frontend and backend
        run: npm run build
        env:
          NODE_ENV: production

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Package deployment artifacts
        run: |
          mkdir -p deploy/apps/backend
          mkdir -p deploy/apps/frontend
          cp -r node_modules deploy/node_modules
          cp -r apps/backend/dist deploy/apps/backend/dist
          cp -r apps/frontend/dist deploy/apps/frontend/dist
          cp package.json deploy/package.json
          cp apps/backend/package.json deploy/apps/backend/package.json
          # Copy backend's own node_modules if they exist (non-hoisted workspace deps)
          if [ -d apps/backend/node_modules ]; then
            cp -r apps/backend/node_modules deploy/apps/backend/node_modules
          fi

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: knowyourlabel
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: deploy
          startup-command: 'node apps/backend/dist/migrate.js && node apps/backend/dist/index.js'
